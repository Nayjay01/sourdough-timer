<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourdough timer</title>
<meta name="theme-color" content="#1B1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sourdough">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #1B1410;
    --surface: #27201A;
    --surface-2: #322920;
    --line: #3B3128;
    --text: #F2E8D8;
    --muted: #A99580;
    --accent: #E3A857;
    --accent-ink: #1B1410;
    --warn: #E06B4C;
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Noto Serif", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  h1, h2, h3, .serif { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: 30px; line-height: 1.15; }
  h2 { font-size: 22px; line-height: 1.2; }
  h3 { font-size: 18px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .accent { color: var(--accent); }
  .small { font-size: 14px; }
  a { color: var(--accent); }

  .app { max-width: 560px; margin: 0 auto; padding: 16px 18px 48px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .topbar .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button, .btn {
    font: inherit; font-size: 15px; font-weight: 500;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  button:active, .btn:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.quiet { background: transparent; border-color: transparent; color: var(--muted); padding: 8px 6px; }
  button.icon { padding: 8px; width: 40px; height: 40px; border-radius: 50%; }
  button.wide { width: 100%; }
  button:focus-visible, input:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }

  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .spread { justify-content: space-between; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .card.tap { cursor: pointer; }
  .card.tap:active { background: var(--surface-2); }

  .seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 9px 8px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  label.field { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  input[type="text"], input[type="datetime-local"], input[type="time"], input[type="number"] {
    font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
    color-scheme: dark;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .switch input { width: 20px; height: 20px; accent-color: var(--accent); }

  /* Hero on bake view */
  .hero { padding: 6px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .hero .ready { font-family: var(--serif); font-size: 44px; line-height: 1.05; margin: 2px 0 4px; }
  .hero .next { margin-top: 12px; padding: 12px 14px; background: var(--surface); border-radius: 12px; border-left: 3px solid var(--accent); }
  .hero .next .serif { font-size: 20px; }

  /* Timeline */
  .timeline { position: relative; padding-left: 26px; }
  .timeline::before {
    content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line);
  }
  .step { position: relative; padding: 10px 0 14px; border-bottom: 1px solid var(--line); }
  .step:last-child { border-bottom: 0; }
  .step::before {
    content: ""; position: absolute; left: -24px; top: 17px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--muted);
  }
  .step.done::before { background: var(--muted); border-color: var(--muted); }
  .step.current::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px rgba(227,168,87,0.22); }
  .step.conflict::before { border-color: var(--warn); }
  .step.done .name, .step.done .when { color: var(--muted); }
  .step .when { font-family: var(--serif); font-size: 19px; }
  .step.conflict .when { color: var(--warn); }
  .step .name { font-size: 16px; }
  .step .dur { font-size: 14px; color: var(--muted); }
  .step .controls { margin-top: 8px; }
  .step .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .step .actions button { padding: 7px 11px; font-size: 14px; }
  .nowline { position: relative; height: 0; border-top: 1px dashed var(--accent); margin: 0 0 0 -26px; }
  .nowline span { position: absolute; right: 0; top: -9px; font-size: 12px; color: var(--accent); background: var(--bg); padding: 0 4px; }

  .notice { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
  .notice.bad { border-color: var(--warn); }
  .notice.good { border-color: var(--accent); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; z-index: 10; }
  .sheet-backdrop.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--surface); border-radius: 18px 18px 0 0; border-top: 1px solid var(--line);
    max-height: 88vh; overflow: auto; padding: 16px 18px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform 220ms ease;
  }
  .sheet.open { transform: translateY(0); }
  .sheet .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 14px; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

  .empty { text-align: left; padding: 30px 0; }
  .empty h2 { margin-bottom: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity 180ms; z-index: 20;
  }
  .toast.show { opacity: 1; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details { margin-top: 12px; }
  ol { padding-left: 20px; margin: 8px 0; }
  li { margin-bottom: 4px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Scheduling model — pure functions, no DOM
   ============================================================ */
const MIN = 60 * 1000;

const STEP_DEFS = [
  { id: 'mix',   name: 'Mix the dough',      dur: 15,  min: 5,   max: 30,   inc: 5,  attend: 'start', note: 'Starter, water, flour, salt.' },
  { id: 'rest',  name: 'First rest',         dur: 45,  min: 15,  max: 120,  inc: 5,  attend: 'none',  note: 'Wait until it has grown about 50%.' },
  { id: 'fold1', name: 'Stretch and fold 1', dur: 30,  min: 15,  max: 60,   inc: 5,  attend: 'start' },
  { id: 'fold2', name: 'Stretch and fold 2', dur: 30,  min: 15,  max: 60,   inc: 5,  attend: 'start' },
  { id: 'fold3', name: 'Stretch and fold 3', dur: 30,  min: 15,  max: 60,   inc: 5,  attend: 'start' },
  { id: 'fold4', name: 'Stretch and fold 4', dur: 30,  min: 15,  max: 60,   inc: 5,  attend: 'start' },
  { id: 'bulk',  name: 'Bulk ferment',       dur: 300, min: 120, max: 600,  inc: 15, attend: 'none',  note: 'Leave it. Adjust the slider if it is running fast or slow.' },
  { id: 'shape', name: 'Shape',              dur: 30,  min: 10,  max: 60,   inc: 5,  attend: 'both',  note: 'Shape, into the banneton, into the fridge.' },
  { id: 'cold',  name: 'Cold proof',         dur: 720, min: 480, max: 1440, inc: 30, attend: 'none',  flex: true, note: 'In the fridge. This is the step that stretches around sleep.' },
  { id: 'bake',  name: 'Bake',               dur: 50,  min: 30,  max: 90,   inc: 5,  attend: 'both',  note: 'From cold, in the Dutch oven.' },
  { id: 'cool',  name: 'Cool',               dur: 60,  min: 30,  max: 180,  inc: 15, attend: 'none',  note: 'Do not cut it yet.' },
];
const STEP_BY_ID = Object.fromEntries(STEP_DEFS.map(s => [s.id, s]));
const COLD_INDEX = STEP_DEFS.findIndex(s => s.id === 'cold');

const DEFAULT_SETTINGS = {
  sleepStart: '22:00',
  sleepEnd: '08:00',
  durs: Object.fromEntries(STEP_DEFS.map(s => [s.id, s.dur])),
  coldMin: 480,
  coldMax: 1440,
};

function minutesOfDay(t) {
  const d = new Date(t);
  return d.getHours() * 60 + d.getMinutes();
}
function parseHM(hm) {
  const [h, m] = hm.split(':').map(Number);
  return h * 60 + m;
}
function isAsleep(t, settings) {
  const m = minutesOfDay(t);
  const s = parseHM(settings.sleepStart), e = parseHM(settings.sleepEnd);
  if (s === e) return false;
  if (s < e) return m >= s && m < e;
  return m >= s || m < e; // wraps midnight
}

/** Build a timeline from a start time and a durations map. */
function buildTimeline(startAt, durs) {
  let t = startAt;
  return STEP_DEFS.map(def => {
    const dur = durs[def.id];
    const step = { def, start: t, end: t + dur * MIN, dur };
    t = step.end;
    return step;
  });
}
function readyAt(timeline) { return timeline[timeline.length - 1].end; }

/** Moments where a person must be awake. */
function attendMoments(timeline) {
  const out = [];
  for (const s of timeline) {
    if (s.def.attend === 'start' || s.def.attend === 'both') out.push({ t: s.start, step: s, label: s.def.name });
    if (s.def.attend === 'both') out.push({ t: s.end, step: s, label: `Finish ${s.def.name.toLowerCase()}` });
  }
  return out;
}
function conflicts(timeline, settings, respectSleep) {
  if (!respectSleep) return [];
  return attendMoments(timeline).filter(m => isAsleep(m.t, settings));
}
function totalMinutes(durs) { return STEP_DEFS.reduce((a, d) => a + durs[d.id], 0); }

/** Forward: start now, stretch the cold proof so the bake lands in waking hours. */
function solveForward(startAt, settings, respectSleep) {
  const durs = { ...settings.durs };
  const inc = STEP_BY_ID.cold.inc;
  for (let d = settings.coldMin; d <= settings.coldMax; d += inc) {
    durs.cold = d;
    const tl = buildTimeline(startAt, durs);
    if (conflicts(tl, settings, respectSleep).length === 0) return { ok: true, startAt, durs, timeline: tl };
  }
  durs.cold = settings.durs.cold;
  const tl = buildTimeline(startAt, durs);
  return { ok: false, startAt, durs, timeline: tl, conflicts: conflicts(tl, settings, respectSleep) };
}
/** Earliest start at or after `from` that works. */
function nextGoodStart(from, settings, respectSleep, horizonHours = 48) {
  for (let t = from; t <= from + horizonHours * 60 * MIN; t += 15 * MIN) {
    const r = solveForward(t, settings, respectSleep);
    if (r.ok) return r;
  }
  return null;
}
/** Backward: finish cooling at `ready`. Shortest cold proof that works wins (latest possible start). */
function solveBackward(ready, settings, respectSleep) {
  const durs = { ...settings.durs };
  const inc = STEP_BY_ID.cold.inc;
  for (let d = settings.coldMin; d <= settings.coldMax; d += inc) {
    durs.cold = d;
    const startAt = ready - totalMinutes(durs) * MIN;
    const tl = buildTimeline(startAt, durs);
    if (conflicts(tl, settings, respectSleep).length === 0) return { ok: true, startAt, durs, timeline: tl };
  }
  durs.cold = settings.durs.cold;
  const startAt = ready - totalMinutes(durs) * MIN;
  const tl = buildTimeline(startAt, durs);
  return { ok: false, startAt, durs, timeline: tl, conflicts: conflicts(tl, settings, respectSleep) };
}
/** Nearest workable ready times on either side of a failed target. */
function nearbyReadyTimes(ready, settings, respectSleep) {
  let earlier = null, later = null;
  for (let k = 1; k <= 96 && (!earlier || !later); k++) {
    if (!earlier && solveBackward(ready - k * 15 * MIN, settings, respectSleep).ok) earlier = ready - k * 15 * MIN;
    if (!later && solveBackward(ready + k * 15 * MIN, settings, respectSleep).ok) later = ready + k * 15 * MIN;
  }
  return { earlier, later };
}
/** Re-solve only the cold proof for an existing bake, keeping everything else. */
function refitCold(bake, settings) {
  const durs = { ...bake.durs };
  const inc = STEP_BY_ID.cold.inc;
  for (let d = settings.coldMin; d <= settings.coldMax; d += inc) {
    durs.cold = d;
    if (conflicts(buildTimeline(bake.startAt, durs), settings, bake.respectSleep).length === 0) return d;
  }
  return null;
}

/** Move step i's start to `newStart` by stretching or trimming the step before it. */
function shiftStart(bake, tl, i, newStart) {
  const delta = newStart - tl[i].start;
  if (i === 0) { bake.startAt += delta; return; }
  const prev = tl[i - 1];
  bake.durs[prev.def.id] = Math.max(0, Math.round((prev.end + delta - prev.start) / MIN));
}
/**
 * "Done now" on a step. Folds are an action at the start of the step, so done
 * means "I did it now" and the gap to the next fold stays. Every other step is
 * a span that ends when you say so, so its real duration becomes what elapsed.
 */
function markDone(bake, tl, id) {
  const i = tl.findIndex(s => s.def.id === id);
  const s = tl[i];
  const now = Date.now();
  const actionAtStart = s.def.attend === 'start' && s.def.id !== 'mix';
  if (actionAtStart) {
    shiftStart(bake, tl, i, now);
  } else if (now < s.start) {
    shiftStart(bake, tl, i, now - s.dur * MIN);
  } else {
    bake.durs[id] = Math.max(0, Math.round((now - s.start) / MIN));
  }
  bake.done[id] = true;
}

/* ============================================================
   Formatting
   ============================================================ */
function sameDay(a, b) {
  const x = new Date(a), y = new Date(b);
  return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
}
function fmtTime(t) {
  return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).toLowerCase().replace(' ', '');
}
function fmtDayWord(t, now = Date.now()) {
  if (sameDay(t, now)) return 'Today';
  if (sameDay(t, now + 24 * 60 * MIN)) return 'Tomorrow';
  if (sameDay(t, now - 24 * 60 * MIN)) return 'Yesterday';
  return new Date(t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
}
function fmtWhen(t, now = Date.now()) { return `${fmtDayWord(t, now)} ${fmtTime(t)}`; }
function fmtDur(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}
function fmtCountdown(ms) {
  const neg = ms < 0; ms = Math.abs(ms);
  const mins = Math.round(ms / MIN);
  const s = mins < 1 ? 'now' : fmtDur(mins);
  return neg ? `${s} overdue` : `in ${s}`;
}
function toLocalInput(t) {
  const d = new Date(t);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function roundTo(t, mins) { return Math.round(t / (mins * MIN)) * mins * MIN; }

/* ============================================================
   Alarms and calendar
   ============================================================ */
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const IS_IOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function androidAlarmUrl(t, label) {
  const d = new Date(t);
  const msg = encodeURIComponent(label.replace(/[;#]/g, ' '));
  return `intent://#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${d.getHours()};i.android.intent.extra.alarm.MINUTES=${d.getMinutes()};S.android.intent.extra.alarm.MESSAGE=${msg};B.android.intent.extra.alarm.SKIP_UI=false;end`;
}
const IOS_SHORTCUT_NAME = 'Sourdough alarm';
function iosShortcutUrl(t, label) {
  const time = new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const input = encodeURIComponent(`${time}|${label}`);
  return `shortcuts://run-shortcut?name=${encodeURIComponent(IOS_SHORTCUT_NAME)}&input=text&text=${input}`;
}
function icsStamp(t) {
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
}
function icsEscape(s) { return String(s).replace(/([,;\\])/g, '\\$1'); }
function buildIcs(bake, moments) {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Sourdough timer//EN', 'CALSCALE:GREGORIAN'];
  moments.forEach((m, i) => {
    lines.push('BEGIN:VEVENT',
      `UID:${bake.id}-${i}-${m.t}@sourdough`,
      `DTSTAMP:${icsStamp(Date.now())}Z`,
      `DTSTART:${icsStamp(m.t)}`,
      `DTEND:${icsStamp(m.t + 5 * MIN)}`,
      `SUMMARY:${icsEscape(`${m.label} (${bake.name})`)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0M', `DESCRIPTION:${icsEscape(m.label)}`, 'END:VALARM',
      'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadIcs(bake, moments, filename) {
  const blob = new Blob([buildIcs(bake, moments)], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
}

/* ============================================================
   State
   ============================================================ */
const LS_KEY = 'sourdough.v1';
let state = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    return {
      bakes: Array.isArray(s.bakes) ? s.bakes : [],
      settings: { ...DEFAULT_SETTINGS, ...(s.settings || {}), durs: { ...DEFAULT_SETTINGS.durs, ...((s.settings || {}).durs || {}) } },
      view: { screen: 'home' },
    };
  } catch { return { bakes: [], settings: { ...DEFAULT_SETTINGS }, view: { screen: 'home' } }; }
}
function save() {
  localStorage.setItem(LS_KEY, JSON.stringify({ bakes: state.bakes, settings: state.settings }));
}
function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36); }
function bakeById(id) { return state.bakes.find(b => b.id === id); }

function currentIndex(bake) {
  const i = STEP_DEFS.findIndex(d => !bake.done[d.id]);
  return i === -1 ? STEP_DEFS.length : i;
}
function nextAction(bake, now = Date.now()) {
  const tl = buildTimeline(bake.startAt, bake.durs);
  const ci = currentIndex(bake);
  if (ci >= STEP_DEFS.length) return { label: 'Ready to eat', t: readyAt(tl), finished: true };
  const s = tl[ci];
  const attendEnd = s.def.attend === 'both' || s.def.attend === 'none';
  // Current step: if its start is still ahead, that's the next action; otherwise its end.
  if (s.start > now && (s.def.attend === 'start' || s.def.attend === 'both')) return { label: s.def.name, t: s.start, step: s };
  if (attendEnd) {
    const nxt = tl[ci + 1];
    const label = s.def.attend === 'both' ? `Finish ${s.def.name.toLowerCase()}` : (nxt ? nxt.def.name : 'Ready to eat');
    return { label, t: s.end, step: s };
  }
  return { label: s.def.name, t: s.start, step: s };
}

/* ============================================================
   Share links
   ============================================================ */
function encodeBake(bake) {
  const json = JSON.stringify({ n: bake.name, s: bake.startAt, d: bake.durs, r: bake.respectSleep ? 1 : 0, k: bake.done });
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeBake(str) {
  try {
    const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    const o = JSON.parse(decodeURIComponent(escape(atob(b64))));
    return { id: uid(), name: o.n || 'Shared bake', startAt: o.s, durs: { ...DEFAULT_SETTINGS.durs, ...o.d }, respectSleep: !!o.r, done: o.k || {}, createdAt: Date.now() };
  } catch { return null; }
}
function shareUrl(bake) {
  const base = location.href.split('#')[0];
  return `${base}#b=${encodeBake(bake)}`;
}
async function shareBake(bake) {
  const url = shareUrl(bake);
  if (navigator.share) {
    try { await navigator.share({ title: bake.name, text: `Sourdough: ${bake.name}`, url }); return; } catch { /* cancelled */ }
  }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch { prompt('Copy this link', url); }
}

/* ============================================================
   Rendering
   ============================================================ */
const app = document.getElementById('app');
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
let tick = null;

function h(strings, ...vals) {
  return strings.reduce((out, s, i) => out + s + (i < vals.length ? vals[i] : ''), '');
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function render() {
  clearInterval(tick);
  const v = state.view;
  if (v.screen === 'bake' && bakeById(v.id)) {
    renderBake(bakeById(v.id));
    tick = setInterval(() => { if (state.view.screen === 'bake') renderBake(bakeById(state.view.id), true); }, 30 * 1000);
  } else {
    state.view = { screen: 'home' };
    renderHome();
    tick = setInterval(() => { if (state.view.screen === 'home') renderHome(); }, 60 * 1000);
  }
}

function renderHome() {
  const now = Date.now();
  const active = state.bakes.slice().sort((a, b) => a.startAt - b.startAt);
  app.innerHTML = h`
    <div class="topbar">
      <div class="left"><h1>Sourdough</h1></div>
      <div class="row">
        <button class="icon quiet" aria-label="Settings" data-act="settings">${gear()}</button>
        <button class="primary" data-act="new">New bake</button>
      </div>
    </div>
    ${active.length === 0 ? h`
      <div class="empty">
        <h2>No bakes on the go.</h2>
        <p class="muted">Plan one from now, or work backwards from when you want to eat.</p>
      </div>` : ''}
    ${active.map(b => {
      const na = nextAction(b, now);
      const tl = buildTimeline(b.startAt, b.durs);
      const cf = conflicts(tl, state.settings, b.respectSleep);
      return h`
      <div class="card tap" data-open="${b.id}" role="button" tabindex="0">
        <div class="row spread">
          <h3>${esc(b.name)}</h3>
          <span class="small muted">Ready ${fmtWhen(readyAt(tl), now)}</span>
        </div>
        <div style="margin-top:8px" class="row spread">
          <span class="serif ${na.finished ? 'muted' : ''}" style="font-size:19px">${esc(na.label)}</span>
          <span class="${na.t - now < 0 && !na.finished ? 'warn' : 'accent'}">${na.finished ? '' : fmtCountdown(na.t - now)}</span>
        </div>
        ${cf.length ? h`<div class="small warn" style="margin-top:6px">${cf.length} step${cf.length > 1 ? 's' : ''} land while you're asleep</div>` : ''}
      </div>`;
    }).join('')}
  `;
  app.querySelectorAll('[data-open]').forEach(el => {
    const go = () => { state.view = { screen: 'bake', id: el.dataset.open }; render(); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  app.querySelector('[data-act="new"]').onclick = openNewBake;
  app.querySelector('[data-act="settings"]').onclick = openSettings;
}

function renderBake(bake, quiet = false) {
  const now = Date.now();
  const tl = buildTimeline(bake.startAt, bake.durs);
  const cf = conflicts(tl, state.settings, bake.respectSleep);
  const conflictSteps = new Set(cf.map(m => m.step.def.id));
  const ci = currentIndex(bake);
  const na = nextAction(bake, now);
  const scrollY = window.scrollY;

  let nowPlaced = false;
  const stepsHtml = tl.map((s, i) => {
    const cls = ['step', i < ci ? 'done' : '', i === ci ? 'current' : '', conflictSteps.has(s.def.id) ? 'conflict' : ''].join(' ');
    let nowline = '';
    if (!nowPlaced && s.start > now) { nowline = h`<div class="nowline"><span>now</span></div>`; nowPlaced = true; }
    const adjustable = i >= ci;
    const min = s.def.flex ? state.settings.coldMin : s.def.min;
    const max = s.def.flex ? state.settings.coldMax : s.def.max;
    return nowline + h`
      <div class="${cls}" data-step="${s.def.id}">
        <div class="row spread">
          <div>
            <div class="when">${fmtWhen(s.start, now)}</div>
            <div class="name">${esc(s.def.name)}</div>
          </div>
          <div class="dur" id="dur-${s.def.id}">${fmtDur(s.dur)}</div>
        </div>
        ${s.def.note && i >= ci ? h`<div class="small muted">${esc(s.def.note)}</div>` : ''}
        ${adjustable ? h`
          <div class="controls">
            <input type="range" min="${min}" max="${max}" step="${s.def.inc}" value="${s.dur}" data-slider="${s.def.id}" aria-label="${esc(s.def.name)} duration">
          </div>` : ''}
        ${i >= ci ? h`
          <div class="actions">
            ${i === ci ? h`<button class="primary" data-done="${s.def.id}">Done now</button>` : ''}
            ${(s.def.attend !== 'none') ? h`<button data-alarm="${s.def.id}">${bell()} Alarm</button>` : ''}
            ${s.def.attend === 'both' ? h`<button data-alarm-end="${s.def.id}">${bell()} End alarm</button>` : ''}
          </div>` : ''}
      </div>`;
  }).join('');

  app.innerHTML = h`
    <div class="topbar">
      <div class="left">
        <button class="icon quiet" aria-label="Back" data-act="back">${chevron()}</button>
        <h1>${esc(bake.name)}</h1>
      </div>
      <button class="icon quiet" aria-label="Share" data-act="share">${shareIcon()}</button>
    </div>
    <div class="hero">
      <div class="muted">Ready to eat</div>
      <div class="ready">${fmtWhen(readyAt(tl), now)}</div>
      <div class="muted small">Started ${fmtWhen(bake.startAt, now)}</div>
      <div class="next">
        <div class="muted small">${na.finished ? 'Finished' : 'Next'}</div>
        <div class="row spread">
          <span class="serif">${esc(na.label)}</span>
          <span class="${na.t - now < 0 && !na.finished ? 'warn' : 'accent'}">${na.finished ? '' : fmtCountdown(na.t - now)}</span>
        </div>
      </div>
    </div>
    ${cf.length ? h`
      <div class="notice bad">
        <div><strong>${cf.length} step${cf.length > 1 ? 's' : ''}</strong> now fall in your sleep window (${fmtSleep()}).</div>
        <div class="row wrap" style="margin-top:10px">
          <button data-act="refit">Refit the cold proof</button>
          <button class="quiet" data-act="ignore">Ignore for this bake</button>
        </div>
      </div>` : ''}
    <div class="timeline">${stepsHtml}</div>
    <div class="stack" style="margin-top:22px">
      <button class="wide" data-act="calendar">${cal()} Add every step to calendar</button>
      <div class="row">
        <label class="field" style="margin:0;flex:1">Started at
          <input type="datetime-local" value="${toLocalInput(bake.startAt)}" data-act="start" style="margin-top:4px">
        </label>
      </div>
      <label class="switch"><span>Avoid sleep window (${fmtSleep()})</span><input type="checkbox" ${bake.respectSleep ? 'checked' : ''} data-act="sleep"></label>
      <button class="quiet" data-act="delete" style="color:var(--warn)">Delete this bake</button>
    </div>
    ${alarmHelp()}
  `;
  window.scrollTo(0, scrollY);

  app.querySelector('[data-act="back"]').onclick = () => { state.view = { screen: 'home' }; render(); };
  app.querySelector('[data-act="share"]').onclick = () => shareBake(bake);
  app.querySelector('[data-act="calendar"]').onclick = () => downloadIcs(bake, attendMoments(tl).filter(m => m.t > now), `${slug(bake.name)}.ics`);
  app.querySelector('[data-act="delete"]').onclick = () => {
    if (confirm(`Delete "${bake.name}"?`)) { state.bakes = state.bakes.filter(b => b.id !== bake.id); save(); state.view = { screen: 'home' }; render(); }
  };
  app.querySelector('[data-act="start"]').onchange = e => { const t = new Date(e.target.value).getTime(); if (!isNaN(t)) { bake.startAt = t; save(); renderBake(bake); } };
  app.querySelector('[data-act="sleep"]').onchange = e => { bake.respectSleep = e.target.checked; save(); renderBake(bake); };
  const refit = app.querySelector('[data-act="refit"]');
  if (refit) refit.onclick = () => {
    const d = refitCold(bake, state.settings);
    if (d == null) { toast('No cold proof length fixes this'); return; }
    bake.durs.cold = d; save(); renderBake(bake); toast(`Cold proof set to ${fmtDur(d)}`);
  };
  const ignore = app.querySelector('[data-act="ignore"]');
  if (ignore) ignore.onclick = () => { bake.respectSleep = false; save(); renderBake(bake); };

  app.querySelectorAll('[data-slider]').forEach(inp => {
    const id = inp.dataset.slider;
    inp.oninput = () => { document.getElementById(`dur-${id}`).textContent = fmtDur(Number(inp.value)); };
    inp.onchange = () => { bake.durs[id] = Number(inp.value); save(); renderBake(bake); };
  });
  app.querySelectorAll('[data-done]').forEach(btn => btn.onclick = () => {
    markDone(bake, tl, btn.dataset.done);
    save(); renderBake(bake);
  });
  app.querySelectorAll('[data-alarm],[data-alarm-end]').forEach(btn => btn.onclick = () => {
    const end = 'alarmEnd' in btn.dataset;
    const id = end ? btn.dataset.alarmEnd : btn.dataset.alarm;
    const s = tl.find(x => x.def.id === id);
    const t = end ? s.end : s.start;
    const label = end ? `Finish ${s.def.name.toLowerCase()}` : s.def.name;
    openAlarmSheet(bake, t, label);
  });
}

function fmtSleep() {
  const f = hm => { const [H, M] = hm.split(':').map(Number); const d = new Date(); d.setHours(H, M, 0, 0); return fmtTime(d.getTime()); };
  return `${f(state.settings.sleepStart)}–${f(state.settings.sleepEnd)}`;
}
function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'bake'; }

/* ---------- Sheets ---------- */
function openSheet(html) {
  sheet.innerHTML = `<div class="handle"></div>${html}`;
  sheet.classList.add('open'); backdrop.classList.add('open');
}
function closeSheet() { sheet.classList.remove('open'); backdrop.classList.remove('open'); }
backdrop.onclick = closeSheet;

function openNewBake() {
  const now = Date.now();
  const defaultReady = roundTo(now + 2 * 24 * 60 * MIN, 30);
  const draft = { mode: 'now', ready: defaultReady, respectSleep: true, name: '' };
  const draw = () => {
    const s = state.settings;
    let result, notice = '';
    if (draft.mode === 'now') {
      result = solveForward(now, s, draft.respectSleep);
      if (!result.ok) {
        const alt = nextGoodStart(now, s, draft.respectSleep);
        const first = result.conflicts[0];
        notice = h`<div class="notice bad">Starting now puts <strong>${esc(first.label)}</strong> at ${fmtWhen(first.t, now)}, while you're asleep.
          ${alt ? h`<div style="margin-top:8px">Earliest good start is <strong>${fmtWhen(alt.startAt, now)}</strong>. <button data-alt="${alt.startAt}" style="margin-top:8px">Plan from then</button></div>` : ''}</div>`;
      }
    } else {
      result = solveBackward(draft.ready, s, draft.respectSleep);
      if (!result.ok) {
        const nb = nearbyReadyTimes(draft.ready, s, draft.respectSleep);
        const first = result.conflicts[0];
        notice = h`<div class="notice bad">Being ready then puts <strong>${esc(first.label)}</strong> at ${fmtWhen(first.t, now)}, while you're asleep.
          <div class="row wrap" style="margin-top:8px">
            ${nb.earlier ? h`<button data-ready="${nb.earlier}">Ready ${fmtWhen(nb.earlier, now)}</button>` : ''}
            ${nb.later ? h`<button data-ready="${nb.later}">Ready ${fmtWhen(nb.later, now)}</button>` : ''}
          </div></div>`;
      }
    }
    if (result.startAt < now - 5 * MIN) {
      notice += h`<div class="notice bad">That start time is already in the past (${fmtWhen(result.startAt, now)}). Pick a later ready time.</div>`;
    }
    const tl = result.timeline;
    openSheet(h`
      <h2>New bake</h2>
      <div class="stack" style="margin-top:14px">
        <div class="seg" role="group" aria-label="Planning mode">
          <button data-mode="now" aria-pressed="${draft.mode === 'now'}">Start now</button>
          <button data-mode="ready" aria-pressed="${draft.mode === 'ready'}">Ready by</button>
        </div>
        ${draft.mode === 'ready' ? h`<label class="field">Ready to eat at<input type="datetime-local" value="${toLocalInput(draft.ready)}" data-ready-input style="margin-top:4px"></label>` : ''}
        <label class="field">Name (optional)<input type="text" placeholder="${esc(autoName(result.startAt))}" value="${esc(draft.name)}" data-name style="margin-top:4px"></label>
        <label class="switch"><span>Avoid sleep window (${fmtSleep()})</span><input type="checkbox" ${draft.respectSleep ? 'checked' : ''} data-sleep></label>
        ${notice}
        <div class="card" style="margin:0">
          <div class="row spread"><span class="muted">Mix</span><span class="serif">${fmtWhen(result.startAt, now)}</span></div>
          <div class="row spread"><span class="muted">Folds</span><span class="serif">${fmtTime(tl[2].start)} to ${fmtTime(tl[5].start)}</span></div>
          <div class="row spread"><span class="muted">Shape, into fridge</span><span class="serif">${fmtWhen(tl[7].start, now)}</span></div>
          <div class="row spread"><span class="muted">Cold proof</span><span class="serif">${fmtDur(result.durs.cold)}</span></div>
          <div class="row spread"><span class="muted">Bake</span><span class="serif">${fmtWhen(tl[9].start, now)}</span></div>
          <div class="row spread"><span class="muted">Ready</span><span class="serif accent">${fmtWhen(readyAt(tl), now)}</span></div>
        </div>
        <button class="primary wide" data-save ${result.ok ? '' : 'title="This plan has sleep conflicts"'}>${result.ok ? 'Save bake' : 'Save anyway'}</button>
      </div>
    `);
    sheet.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { draft.mode = b.dataset.mode; draw(); });
    const ri = sheet.querySelector('[data-ready-input]');
    if (ri) ri.onchange = e => { const t = new Date(e.target.value).getTime(); if (!isNaN(t)) { draft.ready = t; draw(); } };
    sheet.querySelector('[data-name]').oninput = e => { draft.name = e.target.value; };
    sheet.querySelector('[data-sleep]').onchange = e => { draft.respectSleep = e.target.checked; draw(); };
    sheet.querySelectorAll('[data-ready]').forEach(b => b.onclick = () => { draft.ready = Number(b.dataset.ready); draw(); });
    sheet.querySelectorAll('[data-alt]').forEach(b => b.onclick = () => {
      const r = solveForward(Number(b.dataset.alt), state.settings, draft.respectSleep);
      commit(r);
    });
    sheet.querySelector('[data-save]').onclick = () => commit(result);
    function commit(r) {
      const bake = { id: uid(), name: draft.name.trim() || autoName(r.startAt), startAt: r.startAt, durs: { ...r.durs }, respectSleep: draft.respectSleep, done: {}, createdAt: Date.now() };
      state.bakes.push(bake); save(); closeSheet();
      state.view = { screen: 'bake', id: bake.id }; render();
    }
  };
  draw();
}
function autoName(startAt) {
  return `Bake, ${new Date(startAt).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })}`;
}

function openSettings() {
  const s = state.settings;
  openSheet(h`
    <h2>Settings</h2>
    <p class="muted small" style="margin-top:6px">Defaults for new bakes. Existing bakes keep their own times.</p>
    <div class="stack">
      <div class="row">
        <label class="field" style="flex:1">Asleep from<input type="time" value="${s.sleepStart}" data-s="sleepStart" style="margin-top:4px"></label>
        <label class="field" style="flex:1">Awake at<input type="time" value="${s.sleepEnd}" data-s="sleepEnd" style="margin-top:4px"></label>
      </div>
      ${STEP_DEFS.map(d => d.flex ? h`
        <div>
          <div class="row spread"><span>${esc(d.name)} range</span><span class="muted" id="set-cold">${fmtDur(s.coldMin)} to ${fmtDur(s.coldMax)}</span></div>
          <div class="row">
            <input type="range" min="240" max="1440" step="30" value="${s.coldMin}" data-cold="coldMin" aria-label="Shortest cold proof">
            <input type="range" min="240" max="2160" step="30" value="${s.coldMax}" data-cold="coldMax" aria-label="Longest cold proof">
          </div>
        </div>` : h`
        <div>
          <div class="row spread"><span>${esc(d.name)}</span><span class="muted" id="set-${d.id}">${fmtDur(s.durs[d.id])}</span></div>
          <input type="range" min="${d.min}" max="${d.max}" step="${d.inc}" value="${s.durs[d.id]}" data-dur="${d.id}" aria-label="${esc(d.name)} default duration">
        </div>`).join('')}
      <button class="quiet" data-reset>Reset to defaults</button>
      <button class="primary wide" data-close>Done</button>
    </div>
  `);
  sheet.querySelectorAll('[data-s]').forEach(i => i.onchange = () => { s[i.dataset.s] = i.value; save(); });
  sheet.querySelectorAll('[data-dur]').forEach(i => {
    i.oninput = () => { document.getElementById(`set-${i.dataset.dur}`).textContent = fmtDur(Number(i.value)); };
    i.onchange = () => { s.durs[i.dataset.dur] = Number(i.value); save(); };
  });
  sheet.querySelectorAll('[data-cold]').forEach(i => {
    i.oninput = () => {
      s[i.dataset.cold] = Number(i.value);
      if (s.coldMin > s.coldMax) { if (i.dataset.cold === 'coldMin') s.coldMax = s.coldMin; else s.coldMin = s.coldMax; }
      document.getElementById('set-cold').textContent = `${fmtDur(s.coldMin)} to ${fmtDur(s.coldMax)}`;
    };
    i.onchange = () => { save(); };
  });
  sheet.querySelector('[data-reset]').onclick = () => { state.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); save(); openSettings(); };
  sheet.querySelector('[data-close]').onclick = () => { closeSheet(); render(); };
}

function openAlarmSheet(bake, t, label) {
  const now = Date.now();
  const farOff = t - now > 24 * 60 * MIN;
  const both = !IS_ANDROID && !IS_IOS;
  openSheet(h`
    <h2>${esc(label)}</h2>
    <div class="serif" style="font-size:28px;margin:4px 0 12px">${fmtWhen(t, now)}</div>
    ${farOff ? h`<div class="notice">That's more than a day away. A phone alarm has no date, so it would ring tomorrow. Use the calendar option for this one.</div>` : ''}
    <div class="stack">
      ${(IS_ANDROID || both) && !farOff ? h`<a class="btn primary" href="${androidAlarmUrl(t, label)}">${bell()} Set phone alarm (Android)</a>` : ''}
      ${(IS_IOS || both) && !farOff ? h`<a class="btn primary" href="${iosShortcutUrl(t, label)}">${bell()} Set phone alarm (iPhone)</a>` : ''}
      <button data-ics>${cal()} Add to calendar with alert</button>
      <button class="quiet" data-close>Cancel</button>
    </div>
    ${IS_IOS || both ? h`<p class="small muted" style="margin-top:12px">The iPhone button needs the one-time "${IOS_SHORTCUT_NAME}" shortcut. Setup steps are at the bottom of the bake page.</p>` : ''}
  `);
  sheet.querySelector('[data-ics]').onclick = () => { downloadIcs(bake, [{ t, label }], `${slug(label)}.ics`); closeSheet(); };
  sheet.querySelector('[data-close]').onclick = closeSheet;
  sheet.querySelectorAll('a.btn').forEach(a => a.addEventListener('click', () => setTimeout(closeSheet, 300)));
}

function alarmHelp() {
  return h`
    <details>
      <summary>Setting alarms on each phone</summary>
      <div class="small muted" style="margin-top:8px">
        <p><strong>Android.</strong> Tap Alarm on a step. The Clock app opens with the time and label filled in; tap Save.</p>
        <p><strong>iPhone.</strong> One-time setup in the Shortcuts app, then Alarm on a step creates the alarm directly.</p>
        <ol>
          <li>Open Shortcuts, tap +, and name the shortcut exactly <strong>${IOS_SHORTCUT_NAME}</strong>.</li>
          <li>Add the action <strong>Split Text</strong>. Input: Shortcut Input. Separator: Custom, <strong>|</strong></li>
          <li>Add <strong>Get Item from List</strong>: First Item. Then add another <strong>Get Item from List</strong> on the split text: Last Item.</li>
          <li>Add <strong>Create Alarm</strong>. Time: the first item. Label: the last item.</li>
          <li>Done. It receives text like <em>7:30 am|Stretch and fold 2</em>.</li>
        </ol>
        <p><strong>Either phone.</strong> "Add to calendar" downloads a calendar file with an alert at the exact minute. Open it and tap Add.</p>
      </div>
    </details>`;
}

function bell() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`; }
function cal() { return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`; }
function chevron() { return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`; }
function shareIcon() { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>`; }

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- Boot ---------- */
(function boot() {
  const m = location.hash.match(/#b=([A-Za-z0-9_-]+)/);
  if (m) {
    const shared = decodeBake(m[1]);
    history.replaceState(null, '', location.pathname + location.search);
    if (shared) {
      const existing = state.bakes.find(b => b.startAt === shared.startAt && b.name === shared.name);
      if (existing) { Object.assign(existing, { durs: shared.durs, done: shared.done, respectSleep: shared.respectSleep }); state.view = { screen: 'bake', id: existing.id }; toast('Bake updated from link'); }
      else { state.bakes.push(shared); state.view = { screen: 'bake', id: shared.id }; toast('Bake added from link'); }
      save();
    }
  }
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
